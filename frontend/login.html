<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · The Blue Moon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <a href="/" class="mark">The Blue Moon</a>
    </div>
    <p class="login-sub">Small business management &amp; POS &mdash; sign in to continue</p>

    <div class="login-error" id="loginError"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div
        id="loginTurnstile"
        class="cf-turnstile"
        data-sitekey="0x4AAAAAAE98GcL_wHI3Vamr"
        data-theme="auto"
      ></div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Sign in</button>
      <div style="text-align:center; margin-top:12px;">
        <a href="/forgot-password" style="color:var(--ink-700); text-decoration:none;">
          Forgot password?
        </a>
      </div>
    </form>

    <p class="login-hint" style="text-align:center;">
      New customer? <a href="/register">Create an account</a>
    </p>

    <div class="login-hint">

    </div>
  </div>
</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<script src="js/api.js"></script><script src="js/login.js"></script>

</body>
</html>
