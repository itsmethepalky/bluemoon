<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suppliers · Blue Moon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop"></div>
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="mark">Blue Moon</span></div>
    <nav class="sidebar-nav">
      <a class="nav-link" href="dashboard.html" data-roles="admin,staff"><i class="bi bi-speedometer2"></i>Dashboard</a>
      <a class="nav-link" href="my-account.html" data-roles="customer"><i class="bi bi-person-circle"></i>My Account</a>
      <a class="nav-link" href="pos.html" data-roles="admin,staff"><i class="bi bi-cash-stack"></i>POS / Billing</a>
      <a class="nav-link" href="sales-history.html" data-roles="admin,staff"><i class="bi bi-receipt"></i>Sales History</a>
      <div class="sidebar-section-label" data-roles="admin,staff">Catalog &amp; Stock</div>
      <a class="nav-link" href="products.html" data-roles="admin,staff"><i class="bi bi-box-seam"></i>Products &amp; Inventory</a>
      <a class="nav-link" href="purchases.html" data-roles="admin,staff"><i class="bi bi-truck"></i>Purchases</a>
      <a class="nav-link active" href="suppliers.html" data-roles="admin,staff"><i class="bi bi-building"></i>Suppliers</a>
      <div class="sidebar-section-label" data-roles="admin,staff">People</div>
      <a class="nav-link" href="customers.html" data-roles="admin,staff"><i class="bi bi-people"></i>Customers</a>
      <a class="nav-link" href="users.html" data-roles="admin"><i class="bi bi-shield-lock"></i>Staff Accounts</a>
      <div class="sidebar-section-label" data-roles="admin,staff">Insights</div>
      <a class="nav-link" href="reports.html" data-roles="admin,staff"><i class="bi bi-bar-chart-line"></i>Reports</a>
    </nav>
    <div class="sidebar-footer">
      <span class="who" data-who>—</span>
      <span data-role>—</span>
      <button class="btn btn-ghost-light btn-sm" data-logout>Sign out</button>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="flex gap-8" style="align-items:center;">
        <button class="menu-toggle"><i class="bi bi-list"></i></button>
        <div>
          <h1>Suppliers</h1>
          <div class="subtitle">Vendors you purchase stock from</div>
        </div>
      </div>
      <button class="btn btn-primary" id="addSupplierBtn"><i class="bi bi-plus-lg"></i> Add supplier</button>
    </header>

    <main class="content">
      <div class="card">
        <div class="card-body table-scroll">
          <table>
            <thead>
              <tr><th>Name</th><th>Contact person</th><th>Phone</th><th>Email</th><th>Address</th><th></th></tr>
            </thead>
            <tbody id="suppliersBody">
              <tr class="skeleton-row"><td colspan="6">Loading…</td></tr>
            </tbody>
          </table>
          <div class="empty-state hidden" id="suppliersEmpty">
            <i class="bi bi-building"></i>No suppliers yet.
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Add / edit supplier modal -->
<div class="modal-backdrop" id="supplierModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="supplierModalTitle">Add supplier</h2>
      <button class="modal-close" data-close="supplierModal">&times;</button>
    </div>
    <form id="supplierForm">
      <div class="modal-body">
        <input type="hidden" id="supplierId">
        <div class="field"><label for="supplierName">Supplier name</label><input id="supplierName" required></div>
        <div class="form-row">
          <div class="field"><label for="contactPerson">Contact person</label><input id="contactPerson"></div>
          <div class="field"><label for="supplierPhone">Phone</label><input id="supplierPhone"></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="supplierEmail">Email</label><input id="supplierEmail" type="email"></div>
          <div class="field"><label for="supplierAddress">Address</label><input id="supplierAddress"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-close="supplierModal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save supplier</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/api.js"></script>
<script src="js/suppliers.js"></script>
</body>
</html>
