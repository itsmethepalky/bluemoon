<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Choose new password · The Blue Moon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="login-page">
    <div class="login-card">

      <div class="login-brand">
        <a href="index.html" class="mark">The Blue Moon</a>
      </div>

      <p class="login-sub">
        Choose a new password for your account
      </p>

      <div class="login-error" id="formMessage"></div>

      <form id="updatePasswordForm">

        <div class="field">
          <label for="password">New password</label>

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required
            autofocus
          >
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm new password</label>

          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <button
          class="btn btn-primary btn-block"
          type="submit"
          id="updatePasswordBtn"
        >
          Update password
        </button>

      </form>

      <div class="login-hint" style="text-align:center;">
        <a href="login.html">← Back to sign in</a>
      </div>

    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"
    integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp"
    crossorigin="anonymous"
  ></script>

  <script src="js/api.js"></script>
  <script src="js/update-password.js"></script>
</body>
</html>
