<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account · Blue Moon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <span class="mark">Blue Moon</span>
    </div>
    <p class="login-sub">Create a customer account to track your purchases &amp; credit balance</p>

    <div class="login-error" id="formError"></div>

    <form id="registerForm">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" required autofocus>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="phone">Phone (optional)</label>
        <input id="phone">
      </div>
      <div class="field">
        <label for="address">Address (optional)</label>
        <input id="address">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="6" required>
      </div>
      <div
        id="registerTurnstile"
        class="cf-turnstile"
        data-sitekey="0x4AAAAAAE98GcL_wHI3Vamr"
        data-theme="auto"
      ></div>
      <button class="btn btn-primary btn-block" type="submit" id="registerBtn">Create account</button>
    </form>

    <p class="login-hint" style="text-align:center;">
      Already have an account? <a href="login.html">Sign in</a>
    </p>
  </div>
</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<script src="js/api.js"></script><script src="js/register.js"></script>

</body>
</html>
