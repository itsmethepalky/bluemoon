<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset password · The Blue Moon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="login-page">
    <div class="login-card">

      <div class="login-brand">
        <a href="index.html" class="mark">The Blue Moon</a>
      </div>

      <p class="login-sub">
        Reset your password and regain access to your account
      </p>

      <div class="login-error" id="formMessage"></div>

      <form id="forgotPasswordForm">

        <div class="field">
          <label for="email">Email</label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            autofocus
          >
        </div>

        <div
          id="forgotPasswordTurnstile"
          data-sitekey="0x4AAAAAAE98GcL_wHI3Vamr"
          data-theme="auto"
        ></div>

        <button
          class="btn btn-primary btn-block"
          type="submit"
          id="resetBtn"
        >
          Send reset link
        </button>

      </form>

      <p class="login-hint" style="text-align:center;">
        Remember your password?
        <a href="login.html">Sign in</a>
      </p>

      <div class="login-hint">
        A secure password-reset link will be sent to your email if an account exists.
      </div>

    </div>
  </div>

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
    async
    defer
  ></script>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"
    integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp"
    crossorigin="anonymous"
  ></script>

  <script src="js/api.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
